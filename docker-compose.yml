services:
  postgres:
    image: postgres:17-alpine
    container_name: techservice-postgres
    environment:
      POSTGRES_DB: techservice
      POSTGRES_USER: techservice
      POSTGRES_PASSWORD: techservice
    ports:
      - "5432:5432"
    volumes:
      - techservice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techservice -d techservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techservice-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techservice
      DB_USER: techservice
      DB_PASSWORD: techservice
      JWT_SECRET: TechServiceManagerDockerSecretKey_ChangeMe_32b!
      SEED_ENABLED: "true"
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techservice-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 8080 suele estar ocupado por Payara en OTIC-PC7136
      - "8088:80"

volumes:
  techservice_pgdata:
